name: H.265 Compression Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-compression:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest] # macos-latest
        config: [Debug] # , Release
      fail-fast: false
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache vcpkg
      uses: ./.github/actions/cache-vcpkg

    - name: Cache build artifacts
      uses: actions/cache@v3
      with:
        path: |
          build
        key: ${{ runner.os }}-${{ matrix.config }}-build-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'rtp-stack/CMakeLists.txt', 'vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.config }}-build-
          ${{ runner.os }}-build-

    - name: Install dependencies
      uses: ./.github/actions/install-deps

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Run H.265 Compression Test
      run: python ./run_compression_test.py

    - name: Upload test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          first_frame.bmp
          debug_frames/
        retention-days: 3
