name: H.265 Compression Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  vcpkg:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache vcpkg
      uses: ./.github/actions/cache-vcpkg

    - name: Install dependencies
      uses: ./.github/actions/install-deps

    - name: Setup vcpkg
      run: |
        cd extern/vcpkg
        ./bootstrap-vcpkg.sh
        ./vcpkg integrate install

  test-compression:
    runs-on: ubuntu-latest
    needs: vcpkg

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Restore vcpkg from cache
      uses: ./.github/actions/cache-vcpkg

    - name: Cache build
      uses: actions/cache@v3
      with:
        path: |
          build
        key: ${{ runner.os }}-build-${{ hashFiles('CMakeLists.txt', 'android/CMakeLists.txt', 'src/clients/windows/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-build-

    - name: Install dependencies
      uses: ./.github/actions/install-deps

    - name: Configure CMake
      run: cmake --preset linux-debug

    - name: Build
      run: cmake --build --preset linux-debug

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Run H.265 Compression Test
      run: python ./run_compression_test.py

    - name: Upload test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          first_frame.bmp
          debug_frames/
        retention-days: 3
